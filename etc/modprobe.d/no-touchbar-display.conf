# Keep the Touch Bar's display (adpdrm -> DRM connector DSI-1) away from
# Hyprland. Nothing draws on it here (no tiny-dfr), but its mere presence breaks
# Omarchy's clamshell mode: omarchy-hyprland-monitor-laptop picks the first
# eDP|LVDS|DSI output, gets DSI-1 instead of eDP-1, and on lid close "disables"
# the already-dark Touch Bar while the real panel stays on with the windows.
# Remove this file (and reboot) to use the Touch Bar as a display again.
blacklist adpdrm
blacklist adpdrm_mipi
