# Prefix
set -g prefix C-Space
set -g prefix2 C-b
bind -N "Send prefix" C-Space send-prefix

# Config and help
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"

# Vi mode for copy
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
bind -N "Split pane vertically" -n M-Enter split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" -n M-Escape kill-pane

# h/j/k/l select panes, matching Vim and the Hyprland bindings. Splitting
# moved to - and | below, where the key looks like the divider it makes.
bind -N "Focus pane left"  h select-pane -L
bind -N "Focus pane down"  j select-pane -D
bind -N "Focus pane up"    k select-pane -U
bind -N "Focus pane right" l select-pane -R

# Visual split mnemonics: the key looks like the divider it creates.
#   -  a horizontal divider -> new pane below  (tmux calls this -v)
#   |  a vertical divider   -> new pane right  (tmux calls this -h)
# \ is an unshifted alias for | so you can split without reaching for Shift.
bind -N "Split pane below" - split-window -v -c "#{pane_current_path}"
bind -N "Split pane right" | split-window -h -c "#{pane_current_path}"
bind -N "Split pane right" \\ split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane

# l now selects a pane, so tmux's default last-window moves to Tab.
bind -N "Last window" Tab last-window

bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D

# Ctrl+h/j/k/l jumps between panes with no prefix. These keys are already
# taken in bash (C-l clear-screen, C-k kill-line) and in Vim (window moves),
# so grabbing them outright would break both. Instead: if the pane is running
# Vim, pass the key straight through; otherwise switch panes. Bash keeps
# C-l/C-k via the prefix passthroughs below.
_is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(-wrapped)?(diff)?$'"

bind -N "Focus pane left"  -n C-h if-shell "$_is_vim" 'send-keys C-h' 'select-pane -L'
bind -N "Focus pane down"  -n C-j if-shell "$_is_vim" 'send-keys C-j' 'select-pane -D'
bind -N "Focus pane up"    -n C-k if-shell "$_is_vim" 'send-keys C-k' 'select-pane -U'
bind -N "Focus pane right" -n C-l if-shell "$_is_vim" 'send-keys C-l' 'select-pane -R'

# Same keys inside copy-mode, where the if-shell test cannot run.
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Get the shell's own C-l / C-k back through the prefix.
bind -N "Clear screen" C-l send-keys C-l
bind -N "Kill to end of line" C-k send-keys C-k

bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5

# Window navigation
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
# k now selects a pane, so kill-window moves to X -- next to x (kill pane)
# and K (kill session).
bind -N "Kill window" X kill-window

bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n

bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# Dev layout: editor over terminal in a left column, full-height pane on the
# right. Idempotent -- re-running only re-applies the geometry, never kills a
# pane. Overrides tmux's default L (switch-client -l).
# Proportions: TDL_LEFT_WIDTH / TDL_TOP_HEIGHT (percent).
bind -N "Dev layout (editor | terminal | full-height)" L run-shell "$HOME/.local/bin/tmux-dev-layout"

# Session persistence. resurrect snapshots sessions/windows/panes (layout, cwd,
# scrollback) to @resurrect-dir; continuum drives it on a timer and restores on
# server start, so a reboot no longer costs the whole set. `ts` still creates
# sessions; this only keeps them.
#
# Manual: prefix + C-s saves, prefix + C-r restores.
#
# Panes come back with a shell at the right cwd, not the program that was in
# them -- resurrect only re-launches its own whitelist (nvim, less, top, ...).
# Add to @resurrect-processes to widen that.
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# continuum appends its save hook to status-right, so it must load after the
# status bar is configured above -- keep these two last in the file.
run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux
